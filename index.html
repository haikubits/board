<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"SF Pro"', 'system-ui', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        apple: {
                            blue: '#0071E3',
                            'blue-hover': '#0077ED',
                            purple: '#AF52DE',
                            indigo: '#5856D6',
                            teal: '#30B0C7',
                            green: '#34C759',
                            yellow: '#FF9500',
                            orange: '#FF9500',
                            red: '#FF3B30',
                            pink: '#FF2D55',
                            gray: {
                                50: '#FBFBFD',
                                100: '#F5F5F7',
                                200: '#E5E5EA',
                                300: '#D2D2D7',
                                400: '#AEAEB2',
                                500: '#8E8E93',
                                600: '#636366',
                                700: '#3A3A3C',
                                800: '#1C1C1E',
                                900: '#000000',
                            }
                        }
                    },
                    boxShadow: {
                        'apple-card': '0 2px 8px -1px rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.03)',
                        'apple-card-hover': '0 8px 24px -4px rgba(0, 0, 0, 0.08), 0 3px 6px -2px rgba(0, 0, 0, 0.04)',
                        'apple-modal': '0 25px 60px -15px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(0, 0, 0, 0.05)',
                        'apple-glass': '0 8px 32px 0 rgba(0, 0, 0, 0.06)'
                    }
                }
            }
        }
    </script>
    <style>
        /* SF Pro feel */
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* macOS style subtle scrollbars */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(142, 142, 147, 0.35);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(142, 142, 147, 0.55);
        }

        /* Frosted Glass styling */
        .apple-frosted {
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
        }

        /* Drag & Drop dynamic animations */
        .card-ghost {
            opacity: 0.35 !important;
            transform: scale(0.98) rotate(1deg);
            border: 1px dashed #0071E3 !important;
        }

        .drop-indicator {
            height: 4px;
            background: #0071E3;
            border-radius: 9999px;
            margin: 4px 0;
            box-shadow: 0 0 8px rgba(0, 113, 227, 0.6);
            transition: all 0.15s cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        .column-highlight {
            background-color: rgba(0, 113, 227, 0.04) !important;
            outline: 2px dashed rgba(0, 113, 227, 0.4);
            outline-offset: -2px;
        }

        /* Card interactive micro-transitions */
        .task-card {
            transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.18s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.15s ease;
        }
        .task-card:hover {
            transform: translateY(-2px);
        }
        .task-card:active {
            transform: scale(0.99);
        }

        /* Toast notifications */
        .toast-enter {
            animation: toastIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .toast-exit {
            animation: toastOut 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(16px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(12px) scale(0.96); }
        }

        /* Prevent text selection while dragging */
        .user-select-none {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="h-full bg-[#F5F5F7] dark:bg-[#000000] text-[#1D1D1F] dark:text-[#F5F5F7] flex flex-col font-sans overflow-hidden select-none transition-colors duration-200">

    <!-- Top Global App Bar -->
    <header class="h-14 px-4 sm:px-6 apple-frosted bg-[#FFFFFF]/75 dark:bg-[#1C1C1E]/80 border-b border-black/[0.06] dark:border-white/[0.08] flex items-center justify-between z-30 shrink-0">
        <!-- Left: Logo & Board Dropdown Selector -->
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 pr-3 border-r border-black/[0.08] dark:border-white/[0.1]">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-apple-blue to-apple-indigo flex items-center justify-center text-white shadow-sm">
                    <i data-lucide="kanban" class="w-4 h-4"></i>
                </div>
                <span class="font-semibold tracking-tight text-[15px] hidden sm:inline-block">BoardCraft</span>
            </div>

            <!-- Board Picker Button -->
            <div class="relative">
                <button id="boardPickerBtn" onclick="toggleBoardDropdown()" class="flex items-center gap-2 px-3 py-1.5 rounded-xl hover:bg-black/[0.04] dark:hover:bg-white/[0.08] transition text-[14px] font-medium">
                    <span id="currentBoardIcon" class="w-2.5 h-2.5 rounded-full bg-apple-blue"></span>
                    <span id="currentBoardTitle" class="max-w-[160px] md:max-w-[220px] truncate font-medium">Product Launch</span>
                    <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-apple-gray-500"></i>
                </button>

                <!-- Board Selection Dropdown -->
                <div id="boardDropdown" class="hidden absolute top-full left-0 mt-2 w-72 bg-white/95 dark:bg-[#1C1C1E]/95 apple-frosted rounded-2xl shadow-apple-modal border border-black/[0.08] dark:border-white/[0.1] py-2 z-50">
                    <div class="px-3 pb-2 pt-1 border-b border-black/[0.06] dark:border-white/[0.08] flex items-center justify-between">
                        <span class="text-[11px] font-semibold tracking-wider uppercase text-apple-gray-500">Your Boards</span>
                        <button onclick="openNewBoardModal()" class="text-xs text-apple-blue hover:underline flex items-center gap-1 font-medium">
                            <i data-lucide="plus" class="w-3 h-3"></i> New Board
                        </button>
                    </div>
                    <div id="boardList" class="max-h-60 overflow-y-auto py-1">
                        <!-- Injected via JS -->
                    </div>
                    <div class="pt-1.5 px-2 border-t border-black/[0.06] dark:border-white/[0.08] flex gap-1">
                        <button onclick="openEditBoardModal()" class="flex-1 flex items-center justify-center gap-1.5 py-1.5 text-xs text-apple-gray-600 dark:text-apple-gray-300 hover:bg-black/[0.04] dark:hover:bg-white/[0.08] rounded-lg transition">
                            <i data-lucide="settings" class="w-3.5 h-3.5"></i> Board Settings
                        </button>
                        <button onclick="deleteCurrentBoard()" class="p-1.5 text-apple-red hover:bg-apple-red/10 rounded-lg transition" title="Delete current board">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Center: Instant Search & Filter Bar -->
        <div class="hidden md:flex items-center w-80 relative">
            <i data-lucide="search" class="w-3.5 h-3.5 text-apple-gray-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input id="searchInput" type="text" placeholder="Search tasks, tags, priority..." 
                   oninput="handleSearch(this.value)"
                   class="w-full bg-[#EFEFF4]/80 dark:bg-[#2C2C2E]/80 text-[13px] pl-9 pr-8 py-1.5 rounded-full border-none focus:ring-2 focus:ring-apple-blue/50 text-[#1D1D1F] dark:text-[#F5F5F7] placeholder:text-apple-gray-500 outline-none transition">
            <button id="searchClearBtn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-apple-gray-400 hover:text-apple-gray-600 p-0.5">
                <i data-lucide="x" class="w-3 h-3"></i>
            </button>
        </div>

        <!-- Right: Actions & Theme Switcher -->
        <div class="flex items-center gap-2">
            <!-- Add Column Direct Quick Button -->
            <button onclick="promptAddColumn()" class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 text-[13px] font-medium rounded-full bg-black/[0.05] dark:bg-white/[0.1] hover:bg-black/[0.08] dark:hover:bg-white/[0.15] text-[#1D1D1F] dark:text-[#F5F5F7] transition">
                <i data-lucide="columns" class="w-3.5 h-3.5 text-apple-blue"></i>
                <span>Add Column</span>
            </button>

            <!-- Dark/Light Theme Toggle -->
            <button onclick="toggleDarkMode()" class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-black/[0.06] dark:hover:bg-white/[0.1] text-apple-gray-600 dark:text-apple-gray-300 transition" title="Toggle appearance">
                <i data-lucide="moon" class="w-4 h-4 hidden dark:inline-block"></i>
                <i data-lucide="sun" class="w-4 h-4 dark:hidden"></i>
            </button>

            <!-- Board Stats / Overflow menu -->
            <button onclick="openStatsModal()" class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-black/[0.06] dark:hover:bg-white/[0.1] text-apple-gray-600 dark:text-apple-gray-300 transition" title="Board Analytics">
                <i data-lucide="bar-chart-2" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- Board Canvas Scroll Area -->
    <main class="flex-1 overflow-x-auto overflow-y-hidden p-5 sm:p-6">
        <div id="boardColumnsContainer" class="flex items-start gap-5 h-full pb-3 w-max">
            <!-- Columns injected by JS -->
        </div>
    </main>

    <!-- Card Detail Modal (Sheet/Inspector) -->
    <div id="cardModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 dark:bg-black/60 backdrop-blur-sm transition-opacity">
        <div class="bg-white dark:bg-[#1C1C1E] text-[#1D1D1F] dark:text-[#F5F5F7] rounded-3xl shadow-apple-modal w-full max-w-xl max-h-[90vh] flex flex-col border border-black/[0.08] dark:border-white/[0.1] overflow-hidden transform transition-all duration-200">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-black/[0.06] dark:border-white/[0.08] flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span id="modalColumnBadge" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-apple-blue/10 text-apple-blue">In Progress</span>
                    <span id="modalDateRelative" class="text-xs text-apple-gray-500 font-medium"></span>
                </div>
                <div class="flex items-center gap-1">
                    <button onclick="duplicateActiveCard()" class="p-1.5 hover:bg-black/[0.05] dark:hover:bg-white/[0.1] rounded-lg text-apple-gray-500 transition" title="Duplicate Task">
                        <i data-lucide="copy" class="w-4 h-4"></i>
                    </button>
                    <button onclick="deleteActiveCard()" class="p-1.5 hover:bg-apple-red/10 rounded-lg text-apple-red transition" title="Delete Task">
                        <i data-lucide="trash" class="w-4 h-4"></i>
                    </button>
                    <button onclick="closeCardModal()" class="p-1.5 hover:bg-black/[0.05] dark:hover:bg-white/[0.1] rounded-lg text-apple-gray-500 transition ml-2">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Modal Body Scrollable Content -->
            <div class="p-6 overflow-y-auto space-y-6 flex-1 text-sm">
                <!-- Task Title Input -->
                <div>
                    <input id="modalCardTitle" type="text" placeholder="Task title..." 
                           class="w-full text-xl font-bold bg-transparent border-b border-transparent focus:border-apple-blue outline-none py-1 transition" />
                </div>

                <!-- Attributes Grid (Priority, Due Date, Labels) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-[#F5F5F7] dark:bg-[#2C2C2E]/60 p-4 rounded-2xl">
                    <!-- Priority -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-apple-gray-500 mb-1.5">Priority</label>
                        <select id="modalCardPriority" class="w-full bg-white dark:bg-[#3A3A3C] border border-black/[0.06] dark:border-white/[0.1] rounded-xl px-3 py-2 text-xs font-medium focus:ring-2 focus:ring-apple-blue outline-none">
                            <option value="none">None</option>
                            <option value="low">Low Priority</option>
                            <option value="medium">Medium Priority</option>
                            <option value="high">High Priority</option>
                            <option value="urgent">Urgent</option>
                        </select>
                    </div>

                    <!-- Due Date -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-apple-gray-500 mb-1.5">Due Date</label>
                        <input id="modalCardDueDate" type="date" class="w-full bg-white dark:bg-[#3A3A3C] border border-black/[0.06] dark:border-white/[0.1] rounded-xl px-3 py-1.5 text-xs font-medium focus:ring-2 focus:ring-apple-blue outline-none">
                    </div>

                    <!-- Tag / Category -->
                    <div class="sm:col-span-2">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-apple-gray-500 mb-1.5">Tags (Comma-separated)</label>
                        <input id="modalCardTags" type="text" placeholder="Design, Mobile, Q3..." 
                               class="w-full bg-white dark:bg-[#3A3A3C] border border-black/[0.06] dark:border-white/[0.1] rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-apple-blue outline-none">
                    </div>
                </div>

                <!-- Description / Notes Area -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="text-xs font-semibold uppercase tracking-wider text-apple-gray-500">Notes & Description</label>
                    </div>
                    <textarea id="modalCardDesc" rows="4" placeholder="Add additional context, links, or requirements..." 
                              class="w-full bg-[#F5F5F7] dark:bg-[#2C2C2E]/60 border border-transparent focus:border-apple-blue rounded-2xl p-3.5 text-[13px] outline-none transition resize-none"></textarea>
                </div>

                <!-- Checklist Subtasks -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2">
                            <label class="text-xs font-semibold uppercase tracking-wider text-apple-gray-500">Subtasks / Checklist</label>
                            <span id="checklistProgressText" class="text-[11px] font-medium text-apple-gray-500">0%</span>
                        </div>
                    </div>

                    <!-- Mini Progress Bar -->
                    <div class="w-full h-1.5 bg-[#E5E5EA] dark:bg-[#3A3A3C] rounded-full overflow-hidden mb-3">
                        <div id="checklistProgressBar" class="h-full bg-apple-green transition-all duration-300" style="width: 0%"></div>
                    </div>

                    <!-- Subtask list container -->
                    <div id="modalChecklistItems" class="space-y-2 mb-3">
                        <!-- Dynamic items -->
                    </div>

                    <!-- Add subtask input -->
                    <div class="flex gap-2">
                        <input id="newChecklistInput" type="text" placeholder="Add a subtask item..." 
                               onkeydown="if(event.key==='Enter'){event.preventDefault();addChecklistItem();}"
                               class="flex-1 bg-[#F5F5F7] dark:bg-[#2C2C2E]/60 border-none rounded-xl px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-apple-blue">
                        <button onclick="addChecklistItem()" class="px-3 py-2 rounded-xl bg-black/[0.05] dark:bg-white/[0.1] hover:bg-black/[0.1] dark:hover:bg-white/[0.15] text-xs font-medium transition">Add</button>
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="px-6 py-4 border-t border-black/[0.06] dark:border-white/[0.08] flex items-center justify-end gap-3 bg-[#FBFBFD] dark:bg-[#181819]">
                <button onclick="closeCardModal()" class="px-4 py-2 rounded-full text-xs font-medium text-apple-gray-600 dark:text-apple-gray-300 hover:bg-black/[0.05] dark:hover:bg-white/[0.08] transition">Cancel</button>
                <button onclick="saveCardDetails()" class="px-5 py-2 rounded-full text-xs font-semibold bg-apple-blue hover:bg-apple-blue-hover text-white shadow-sm transition">Done</button>
            </div>
        </div>
    </div>

    <!-- Board Settings / Create Board Modal -->
    <div id="boardModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 dark:bg-black/60 backdrop-blur-sm">
        <div class="bg-white dark:bg-[#1C1C1E] rounded-3xl shadow-apple-modal w-full max-w-md p-6 border border-black/[0.08] dark:border-white/[0.1]">
            <h2 id="boardModalTitle" class="text-lg font-bold mb-4">Board Settings</h2>
            
            <div class="space-y-4 text-xs font-medium">
                <div>
                    <label class="block text-apple-gray-500 uppercase tracking-wider mb-1">Board Name</label>
                    <input id="boardModalInput" type="text" class="w-full bg-[#F5F5F7] dark:bg-[#2C2C2E] rounded-xl px-3.5 py-2.5 text-sm outline-none focus:ring-2 focus:ring-apple-blue border-none">
                </div>

                <div>
                    <label class="block text-apple-gray-500 uppercase tracking-wider mb-2">Accent Color</label>
                    <div class="flex items-center gap-3" id="accentColorPalette">
                        <!-- Colors injected dynamically -->
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-2 mt-6">
                <button onclick="closeBoardModal()" class="px-4 py-2 rounded-full text-xs font-medium hover:bg-black/[0.05] dark:hover:bg-white/[0.08]">Cancel</button>
                <button id="boardModalSaveBtn" onclick="saveBoardSettings()" class="px-5 py-2 rounded-full text-xs font-semibold bg-apple-blue hover:bg-apple-blue-hover text-white transition">Save</button>
            </div>
        </div>
    </div>

    <!-- Analytics / Stats Modal -->
    <div id="statsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 dark:bg-black/60 backdrop-blur-sm">
        <div class="bg-white dark:bg-[#1C1C1E] rounded-3xl shadow-apple-modal w-full max-w-lg p-6 border border-black/[0.08] dark:border-white/[0.1]">
            <div class="flex justify-between items-center mb-5">
                <h3 class="font-bold text-base">Board Overview & Insights</h3>
                <button onclick="document.getElementById('statsModal').classList.add('hidden')" class="p-1 rounded-lg hover:bg-black/[0.05] dark:hover:bg-white/[0.08]">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="grid grid-cols-3 gap-3 mb-6">
                <div class="p-4 bg-[#F5F5F7] dark:bg-[#2C2C2E]/60 rounded-2xl text-center">
                    <div id="statTotalCards" class="text-2xl font-bold text-apple-blue">0</div>
                    <div class="text-[11px] font-medium text-apple-gray-500 mt-0.5">Total Tasks</div>
                </div>
                <div class="p-4 bg-[#F5F5F7] dark:bg-[#2C2C2E]/60 rounded-2xl text-center">
                    <div id="statCompletedCards" class="text-2xl font-bold text-apple-green">0</div>
                    <div class="text-[11px] font-medium text-apple-gray-500 mt-0.5">Completed</div>
                </div>
                <div class="p-4 bg-[#F5F5F7] dark:bg-[#2C2C2E]/60 rounded-2xl text-center">
                    <div id="statUrgentCards" class="text-2xl font-bold text-apple-red">0</div>
                    <div class="text-[11px] font-medium text-apple-gray-500 mt-0.5">Urgent / High</div>
                </div>
            </div>

            <div class="space-y-3">
                <h4 class="text-xs font-semibold uppercase tracking-wider text-apple-gray-500">Distribution by Column</h4>
                <div id="columnStatsList" class="space-y-2">
                    <!-- Dynamic -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 pointer-events-none flex flex-col gap-2"></div>

                columns: [
                    {
                        id: 'col-ds-todo',
                        title: 'To Explore',
                        cards: [
                            {
                                id: 'card-6',
                                title: 'Spatial glass materials for VisionOS',
                                desc: 'Spec specular highlight reflection values.',
                                priority: 'high',
                                dueDate: '',
                                tags: ['Spatial'],
                                checklist: []
                            }
                        ]
                    },
                    {
                        id: 'col-ds-done',
                        title: 'Approved Tokens',
                        cards: [
                            {
                                id: 'card-7',
                                title: 'SF Pro Text optical size curves',
                                desc: 'Completed kerning pairings across dynamic sizes.',
                                priority: 'none',
                                dueDate: '',
                                tags: ['Typography'],
                                checklist: []
                            }
                        ]
                    }
                ]
            }
        ];

        let state = {
            boards: [],
            activeBoardId: null,
            searchQuery: '',
            darkMode: false
        };

        // Active inspection modal state
        let currentModalCard = null;
        let currentModalColumnId = null;
        let modalTempChecklist = [];

        // Drag and Drop active session tracker
        let dragInfo = {
            cardId: null,
            sourceColumnId: null,
            dropTargetColId: null,
            dropTargetCardId: null,
            dropPosition: 'before' // 'before' or 'after'
        };

        function initApp() {
            loadStateFromStorage();
            initTheme();
            renderApp();
            setupGlobalEventListeners();
            lucide.createIcons();
        }

        function loadStateFromStorage() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.boards = parsed.boards || initialBoards;
                    state.activeBoardId = parsed.activeBoardId || state.boards[0].id;
                    state.darkMode = parsed.darkMode || false;
                } catch (e) {
                    console.error('Storage parse failed, restoring default state', e);
                    state.boards = JSON.parse(JSON.stringify(initialBoards));
                    state.activeBoardId = state.boards[0].id;
                }
            } else {
                state.boards = JSON.parse(JSON.stringify(initialBoards));
                state.activeBoardId = state.boards[0].id;
                state.darkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            }

            // Fallback validation
            if (!state.boards.find(b => b.id === state.activeBoardId) && state.boards.length > 0) {
                state.activeBoardId = state.boards[0].id;
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                boards: state.boards,
                activeBoardId: state.activeBoardId,
                darkMode: state.darkMode
            }));
        }

        function getActiveBoard() {
            return state.boards.find(b => b.id === state.activeBoardId) || state.boards[0];
        }

        function initTheme() {
            if (state.darkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleDarkMode() {
            state.darkMode = !state.darkMode;
            initTheme();
            saveState();
            showToast(state.darkMode ? 'Dark Mode activated' : 'Light Mode activated', 'info');
        }

        function setupGlobalEventListeners() {
            // Close dropdowns on outside click
            window.addEventListener('click', (e) => {
                const boardPicker = document.getElementById('boardPickerBtn');
                const boardDropdown = document.getElementById('boardDropdown');
                if (!boardPicker.contains(e.target) && !boardDropdown.contains(e.target)) {
                    boardDropdown.classList.add('hidden');
                }
            });

            // Keyboard shortcut Escape to close modals
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeCardModal();
                    closeBoardModal();
                    document.getElementById('statsModal').classList.add('hidden');
                }
            });
        }

        function renderApp() {
            renderHeaderBoardSelector();
            renderColumns();
            lucide.createIcons();
        }

        function renderHeaderBoardSelector() {
            const activeBoard = getActiveBoard();
            if (!activeBoard) return;

            // Update top bar text & accent indicator
            document.getElementById('currentBoardTitle').textContent = activeBoard.title;
            const dot = document.getElementById('currentBoardIcon');
            dot.style.backgroundColor = activeBoard.accentColor || '#0071E3';

            // Populate dropdown boards list
            const boardListEl = document.getElementById('boardList');
            boardListEl.innerHTML = '';

            state.boards.forEach(b => {
                const isCurrent = b.id === activeBoard.id;
                const item = document.createElement('button');
                item.className = `w-full text-left px-3.5 py-2.5 rounded-xl flex items-center justify-between text-xs font-medium transition ${
                    isCurrent 
                        ? 'bg-apple-blue/10 text-apple-blue font-semibold' 
                        : 'hover:bg-black/[0.04] dark:hover:bg-white/[0.08] text-apple-gray-700 dark:text-apple-gray-200'
                }`;
                item.onclick = () => selectBoard(b.id);

                const countCards = b.columns.reduce((acc, c) => acc + c.cards.length, 0);

                item.innerHTML = `
                    <div class="flex items-center gap-2.5 truncate">
                        <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: ${b.accentColor || '#0071E3'}"></span>
                        <span class="truncate">${escapeHtml(b.title)}</span>
                    </div>
                    <span class="text-[11px] text-apple-gray-400 font-normal ml-2">${countCards}</span>
                `;
                boardListEl.appendChild(item);
            });
        }

        function renderColumns() {
            const board = getActiveBoard();
            const container = document.getElementById('boardColumnsContainer');
            container.innerHTML = '';

            if (!board) return;

            // Render each column in the active board
            board.columns.forEach((col, index) => {
                const colWrapper = document.createElement('div');
                colWrapper.className = 'flex flex-col w-80 max-h-full rounded-[22px] bg-[#FFFFFF]/70 dark:bg-[#1C1C1E]/70 apple-frosted border border-black/[0.06] dark:border-white/[0.08] shadow-apple-card shrink-0 transition-all';
                colWrapper.dataset.columnId = col.id;

                // Column Header
                const colHeader = document.createElement('div');
                colHeader.className = 'px-4 py-3.5 flex items-center justify-between border-b border-black/[0.05] dark:border-white/[0.06]';

                // Visible filtered cards count vs total
                const query = state.searchQuery.toLowerCase().trim();
                const filteredCards = col.cards.filter(c => matchesSearch(c, query));

                colHeader.innerHTML = `
                    <div class="flex items-center gap-2 flex-1 min-w-0 mr-2">
                        <input type="text" value="${escapeHtml(col.title)}" 
                               onblur="renameColumn('${col.id}', this.value)"
                               onkeydown="if(event.key==='Enter') this.blur();"
                               class="font-semibold text-[14px] bg-transparent hover:bg-black/[0.04] dark:hover:bg-white/[0.08] focus:bg-white dark:focus:bg-[#2C2C2E] px-2 py-0.5 rounded-lg w-full truncate outline-none focus:ring-2 focus:ring-apple-blue transition cursor-pointer" />
                        <span class="text-[11px] font-semibold text-apple-gray-500 bg-black/[0.05] dark:bg-white/[0.1] px-2 py-0.5 rounded-full shrink-0">
                            ${filteredCards.length}
                        </span>
                    </div>

                    <div class="flex items-center gap-0.5">
                        <!-- Move Left -->
                        ${index > 0 ? `
                            <button onclick="moveColumnOrder('${col.id}', -1)" class="p-1 rounded-md text-apple-gray-400 hover:text-apple-gray-700 dark:hover:text-white transition" title="Move Left">
                                <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
                            </button>
                        ` : ''}

                        <!-- Move Right -->
                        ${index < board.columns.length - 1 ? `
                            <button onclick="moveColumnOrder('${col.id}', 1)" class="p-1 rounded-md text-apple-gray-400 hover:text-apple-gray-700 dark:hover:text-white transition" title="Move Right">
                                <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                            </button>
                        ` : ''}

                        <!-- Column menu delete -->
                        <button onclick="deleteColumn('${col.id}')" class="p-1 rounded-md text-apple-gray-400 hover:text-apple-red transition" title="Delete Column">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
                colWrapper.appendChild(colHeader);

                // Cards Scroll Container
                const cardsContainer = document.createElement('div');
                cardsContainer.className = 'p-3 flex-1 overflow-y-auto space-y-2.5 min-h-[70px]';
                cardsContainer.dataset.columnDrop = col.id;

                // Bind column drag events
                setupColumnDropEvents(cardsContainer, col.id);

                // Render filtered cards
                filteredCards.forEach(card => {
                    const cardEl = renderCardElement(card, col.id);
                    cardsContainer.appendChild(cardEl);
                });

                colWrapper.appendChild(cardsContainer);

                // Inline Card Quick Add Footer
                const footer = document.createElement('div');
                footer.className = 'p-3 pt-1 border-t border-black/[0.03] dark:border-white/[0.04]';
                footer.appendChild(createQuickAddCardUI(col.id));
                colWrapper.appendChild(footer);

                container.appendChild(colWrapper);
            });

            // Append "+ Add New Column" button card at end of horizontal list
            const addColCard = document.createElement('div');
            addColCard.className = 'w-80 shrink-0';
            addColCard.innerHTML = `
                <button onclick="promptAddColumn()" class="w-full py-3.5 px-4 rounded-[22px] border-2 border-dashed border-black/[0.1] dark:border-white/[0.12] hover:border-apple-blue dark:hover:border-apple-blue hover:bg-apple-blue/[0.03] flex items-center justify-center gap-2 text-sm font-medium text-apple-gray-500 hover:text-apple-blue transition group">
                    <i data-lucide="plus-circle" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
                    <span>Add New Column</span>
                </button>
            `;
            container.appendChild(addColCard);
        }

        function renderCardElement(card, columnId) {
            const cardEl = document.createElement('div');
            cardEl.className = 'task-card bg-white dark:bg-[#2C2C2E] p-3.5 rounded-2xl shadow-apple-card hover:shadow-apple-card-hover border border-black/[0.05] dark:border-white/[0.08] cursor-grab active:cursor-grabbing group relative';
            cardEl.draggable = true;
            cardEl.dataset.cardId = card.id;
            cardEl.dataset.colId = columnId;

            // Click opens inspection sheet
            cardEl.onclick = (e) => {
                if (e.target.closest('button')) return; // Avoid triggering when child action is clicked
                openCardModal(columnId, card.id);
            };

            // Priority Badge Styling
            const priorityConfig = {
                urgent: { label: 'Urgent', bg: 'bg-red-500/10 dark:bg-red-500/20', text: 'text-red-600 dark:text-red-400' },
                high: { label: 'High', bg: 'bg-orange-500/10 dark:bg-orange-500/20', text: 'text-orange-600 dark:text-orange-400' },
                medium: { label: 'Medium', bg: 'bg-yellow-500/10 dark:bg-yellow-500/20', text: 'text-amber-600 dark:text-amber-400' },
                low: { label: 'Low', bg: 'bg-blue-500/10 dark:bg-blue-500/20', text: 'text-blue-600 dark:text-blue-400' },
                none: null
            };

            const pInfo = priorityConfig[card.priority] || null;

            // Checklist stats
            const totalChecks = card.checklist ? card.checklist.length : 0;
            const completedChecks = totalChecks > 0 ? card.checklist.filter(c => c.done).length : 0;

            // Relative date string
            const relativeDate = formatRelativeDate(card.dueDate);

            cardEl.innerHTML = `
                <!-- Tags & Priority row -->
                <div class="flex flex-wrap items-center gap-1.5 mb-2">
                    ${pInfo ? `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-md ${pInfo.bg} ${pInfo.text}">${pInfo.label}</span>` : ''}
                    ${card.tags && card.tags.length > 0 ? card.tags.map(t => `
                        <span class="text-[10px] font-medium px-2 py-0.5 rounded-md bg-black/[0.04] dark:bg-white/[0.08] text-apple-gray-600 dark:text-apple-gray-300">
                            #${escapeHtml(t)}
                        </span>
                    `).join('') : ''}
                </div>

                <!-- Title -->
                <div class="font-medium text-[13.5px] leading-snug tracking-tight text-[#1D1D1F] dark:text-[#F5F5F7] mb-1.5 break-words">
                    ${escapeHtml(card.title)}
                </div>

                <!-- Brief description snippet if available -->
                ${card.desc ? `
                    <p class="text-xs text-apple-gray-500 line-clamp-2 mb-2.5 font-normal leading-relaxed">
                        ${escapeHtml(card.desc)}
                    </p>
                ` : ''}

                <!-- Card Meta Footer (Checklist & Due Date) -->
                ${(totalChecks > 0 || relativeDate) ? `
                    <div class="flex items-center gap-3 pt-2 mt-1 border-t border-black/[0.04] dark:border-white/[0.06] text-[11px] text-apple-gray-500 font-medium">
                        ${totalChecks > 0 ? `
                            <div class="flex items-center gap-1 ${completedChecks === totalChecks ? 'text-apple-green font-semibold' : ''}">
                                <i data-lucide="check-square" class="w-3 h-3"></i>
                                <span>${completedChecks}/${totalChecks}</span>
                            </div>
                        ` : ''}

                        ${relativeDate ? `
                            <div class="flex items-center gap-1 ${relativeDate.isOverdue ? 'text-apple-red font-semibold' : ''}">
                                <i data-lucide="calendar" class="w-3 h-3"></i>
                                <span>${relativeDate.text}</span>
                            </div>
                        ` : ''}
                    </div>
                ` : ''}
            `;

            // Setup card drag events
            setupCardDragEvents(cardEl, card.id, columnId);

            return cardEl;
        }

        function createQuickAddCardUI(columnId) {
            const container = document.createElement('div');

            const btn = document.createElement('button');
            btn.className = 'w-full py-1.5 px-3 rounded-xl flex items-center gap-1.5 text-apple-gray-500 hover:text-apple-blue hover:bg-black/[0.04] dark:hover:bg-white/[0.06] text-xs font-medium transition';
            btn.innerHTML = `<i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Task`;

            const form = document.createElement('div');
            form.className = 'hidden flex-col gap-2 mt-1';

            const textarea = document.createElement('textarea');
            textarea.rows = 2;
            textarea.placeholder = 'Title for this task...';
            textarea.className = 'w-full text-xs p-2.5 rounded-xl bg-white dark:bg-[#2C2C2E] border border-apple-blue/50 focus:ring-2 focus:ring-apple-blue outline-none resize-none shadow-sm';

            const actions = document.createElement('div');
            actions.className = 'flex justify-end items-center gap-1.5';

            const cancelBtn = document.createElement('button');
            cancelBtn.type = 'button';
            cancelBtn.className = 'px-2.5 py-1 text-xs text-apple-gray-500 hover:text-apple-gray-700 rounded-lg';
            cancelBtn.textContent = 'Cancel';

            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.className = 'px-3 py-1 text-xs font-medium bg-apple-blue hover:bg-apple-blue-hover text-white rounded-lg transition shadow-sm';
            addBtn.textContent = 'Add Task';

            actions.appendChild(cancelBtn);
            actions.appendChild(addBtn);
            form.appendChild(textarea);
            form.appendChild(actions);

            btn.onclick = () => {
                btn.classList.add('hidden');
                form.classList.remove('hidden');
                form.classList.add('flex');
                textarea.focus();
            };

            const closeAdd = () => {
                form.classList.add('hidden');
                form.classList.remove('flex');
                btn.classList.remove('hidden');
                textarea.value = '';
            };

            cancelBtn.onclick = closeAdd;

            const submitAdd = () => {
                const title = textarea.value.trim();
                if (title) {
                    addNewCard(columnId, title);
                    textarea.value = '';
                    textarea.focus();
                }
            };

            addBtn.onclick = submitAdd;

            textarea.onkeydown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    submitAdd();
                } else if (e.key === 'Escape') {
                    closeAdd();
                }
            };

            container.appendChild(btn);
            container.appendChild(form);
            return container;
        }

        function setupCardDragEvents(cardEl, cardId, columnId) {
            cardEl.addEventListener('dragstart', (e) => {
                dragInfo.cardId = cardId;
                dragInfo.sourceColumnId = columnId;

                e.dataTransfer.setData('text/plain', cardId);
                e.dataTransfer.effectAllowed = 'move';

                setTimeout(() => {
                    cardEl.classList.add('card-ghost');
                }, 0);
            });

            cardEl.addEventListener('dragend', () => {
                cardEl.classList.remove('card-ghost');
                clearDropIndicators();
                dragInfo.cardId = null;
                dragInfo.sourceColumnId = null;
            });
        }

        function setupColumnDropEvents(container, columnId) {
            container.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';

                const targetCardEl = e.target.closest('.task-card');
                clearDropIndicators();

                if (targetCardEl && targetCardEl.dataset.cardId !== dragInfo.cardId) {
                    const rect = targetCardEl.getBoundingClientRect();
                    const midY = rect.top + rect.height / 2;

                    const indicator = document.createElement('div');
                    indicator.className = 'drop-indicator';

                    if (e.clientY < midY) {
                        targetCardEl.parentNode.insertBefore(indicator, targetCardEl);
                        dragInfo.dropTargetCardId = targetCardEl.dataset.cardId;
                        dragInfo.dropPosition = 'before';
                    } else {
                        targetCardEl.parentNode.insertBefore(indicator, targetCardEl.nextSibling);
                        dragInfo.dropTargetCardId = targetCardEl.dataset.cardId;
                        dragInfo.dropPosition = 'after';
                    }
                } else if (!targetCardEl) {
                    // Over empty column container space
                    dragInfo.dropTargetCardId = null;
                    dragInfo.dropPosition = 'append';
                }

                dragInfo.dropTargetColId = columnId;
            });

            container.addEventListener('drop', (e) => {
                e.preventDefault();
                if (!dragInfo.cardId || !dragInfo.sourceColumnId || !dragInfo.dropTargetColId) {
                    clearDropIndicators();
                    return;
                }

                executeCardMove(
                    dragInfo.cardId,
                    dragInfo.sourceColumnId,
                    dragInfo.dropTargetColId,
                    dragInfo.dropTargetCardId,
                    dragInfo.dropPosition
                );

                clearDropIndicators();
            });
        }

        function clearDropIndicators() {
            document.querySelectorAll('.drop-indicator').forEach(el => el.remove());
        }

        function executeCardMove(cardId, srcColId, targetColId, targetCardId, position) {
            const board = getActiveBoard();
            const srcCol = board.columns.find(c => c.id === srcColId);
            const targetCol = board.columns.find(c => c.id === targetColId);

            if (!srcCol || !targetCol) return;

            const cardIndex = srcCol.cards.findIndex(c => c.id === cardId);
            if (cardIndex === -1) return;

            const [card] = srcCol.cards.splice(cardIndex, 1);

            if (targetCardId) {
                const targetIdx = targetCol.cards.findIndex(c => c.id === targetCardId);
                if (targetIdx !== -1) {
                    const insertIdx = position === 'after' ? targetIdx + 1 : targetIdx;
                    targetCol.cards.splice(insertIdx, 0, card);
                } else {
                    targetCol.cards.push(card);
                }
            } else {
                targetCol.cards.push(card);
            }

            saveState();
            renderColumns();
            lucide.createIcons();
        }

        function addNewCard(columnId, title) {
            const board = getActiveBoard();
            const col = board.columns.find(c => c.id === columnId);
            if (!col) return;

            const newCard = {
                id: 'card-' + Date.now().toString(36) + Math.random().toString(36).substr(2, 4),
                title: title.trim(),
                desc: '',
                priority: 'none',
                dueDate: '',
                tags: [],
                checklist: []
            };

            col.cards.push(newCard);
            saveState();
            renderColumns();
            lucide.createIcons();
            showToast('Task added');
        }

        function openCardModal(columnId, cardId) {
            const board = getActiveBoard();
            const column = board.columns.find(c => c.id === columnId);
            if (!column) return;
            const card = column.cards.find(c => c.id === cardId);
            if (!card) return;

            currentModalCard = card;
            currentModalColumnId = columnId;
            modalTempChecklist = JSON.parse(JSON.stringify(card.checklist || []));

            // Populate Form fields
            document.getElementById('modalColumnBadge').textContent = column.title;
            document.getElementById('modalCardTitle').value = card.title;
            document.getElementById('modalCardDesc').value = card.desc || '';
            document.getElementById('modalCardPriority').value = card.priority || 'none';
            document.getElementById('modalCardDueDate').value = card.dueDate || '';
            document.getElementById('modalCardTags').value = (card.tags || []).join(', ');

            const rel = formatRelativeDate(card.dueDate);
            document.getElementById('modalDateRelative').textContent = rel ? rel.text : '';

            renderChecklistItemsInModal();

            // Reveal modal with blur
            const modal = document.getElementById('cardModal');
            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeCardModal() {
            document.getElementById('cardModal').classList.add('hidden');
            currentModalCard = null;
            currentModalColumnId = null;
        }

        function saveCardDetails() {
            if (!currentModalCard) return;

            currentModalCard.title = document.getElementById('modalCardTitle').value.trim() || 'Untitled Task';
            currentModalCard.desc = document.getElementById('modalCardDesc').value.trim();
            currentModalCard.priority = document.getElementById('modalCardPriority').value;
            currentModalCard.dueDate = document.getElementById('modalCardDueDate').value;

            // Parse tags
            const tagsRaw = document.getElementById('modalCardTags').value;
            currentModalCard.tags = tagsRaw
                .split(',')
                .map(t => t.trim().replace(/^#/, ''))
                .filter(Boolean);

            currentModalCard.checklist = modalTempChecklist;

            saveState();
            renderColumns();
            lucide.createIcons();
            closeCardModal();
            showToast('Changes saved');
        }

        function duplicateActiveCard() {
            if (!currentModalCard || !currentModalColumnId) return;

            const board = getActiveBoard();
            const col = board.columns.find(c => c.id === currentModalColumnId);
            if (!col) return;

            const clone = JSON.parse(JSON.stringify(currentModalCard));
            clone.id = 'card-' + Date.now().toString(36) + Math.random().toString(36).substr(2, 4);
            clone.title = clone.title + ' (Copy)';

            const index = col.cards.findIndex(c => c.id === currentModalCard.id);
            col.cards.splice(index + 1, 0, clone);

            saveState();
            renderColumns();
            lucide.createIcons();
            closeCardModal();
            showToast('Task duplicated');
        }

        function deleteActiveCard() {
            if (!currentModalCard || !currentModalColumnId) return;

            const board = getActiveBoard();
            const col = board.columns.find(c => c.id === currentModalColumnId);
            if (col) {
                col.cards = col.cards.filter(c => c.id !== currentModalCard.id);
                saveState();
                renderColumns();
                lucide.createIcons();
                closeCardModal();
                showToast('Task removed', 'error');
            }
        }

        function renderChecklistItemsInModal() {
            const container = document.getElementById('modalChecklistItems');
            container.innerHTML = '';

            const total = modalTempChecklist.length;
            const completed = modalTempChecklist.filter(i => i.done).length;
            const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('checklistProgressText').textContent = `${percentage}% (${completed}/${total})`;
            document.getElementById('checklistProgressBar').style.width = `${percentage}%`;

            modalTempChecklist.forEach((item, index) => {
                const itemRow = document.createElement('div');
                itemRow.className = 'flex items-center gap-2 bg-[#F5F5F7] dark:bg-[#2C2C2E]/60 px-3 py-2 rounded-xl group';

                itemRow.innerHTML = `
                    <input type="checkbox" ${item.done ? 'checked' : ''} 
                           onchange="toggleChecklistDone(${index}, this.checked)"
                           class="w-4 h-4 rounded text-apple-blue focus:ring-apple-blue/40 rounded-md cursor-pointer">
                    <span class="flex-1 text-xs ${item.done ? 'line-through text-apple-gray-400' : ''}">${escapeHtml(item.text)}</span>
                    <button onclick="removeChecklistItem(${index})" class="opacity-0 group-hover:opacity-100 p-1 text-apple-gray-400 hover:text-apple-red transition">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                `;
                container.appendChild(itemRow);
            });

            lucide.createIcons();
        }

        function addChecklistItem() {
            const input = document.getElementById('newChecklistInput');
            const val = input.value.trim();
            if (val) {
                modalTempChecklist.push({ text: val, done: false });
                input.value = '';
                renderChecklistItemsInModal();
            }
        }

        function toggleChecklistDone(index, isDone) {
            if (modalTempChecklist[index]) {
                modalTempChecklist[index].done = isDone;
                renderChecklistItemsInModal();
            }
        }

        function removeChecklistItem(index) {
            modalTempChecklist.splice(index, 1);
            renderChecklistItemsInModal();
        }

        function promptAddColumn() {
            const colTitle = prompt('Enter a name for the new column:', 'Review & QA');
            if (colTitle && colTitle.trim()) {
                const board = getActiveBoard();
                const newCol = {
                    id: 'col-' + Date.now().toString(36),
                    title: colTitle.trim(),
                    cards: []
                };
                board.columns.push(newCol);
                saveState();
                renderColumns();
                lucide.createIcons();
                showToast(`Column "${newCol.title}" created`);
            }
        }

        function renameColumn(colId, newTitle) {
            const cleanTitle = newTitle.trim();
            if (!cleanTitle) return;

            const board = getActiveBoard();
            const col = board.columns.find(c => c.id === colId);
            if (col && col.title !== cleanTitle) {
                col.title = cleanTitle;
                saveState();
                renderColumns();
                lucide.createIcons();
                showToast('Column renamed');
            }
        }

        function deleteColumn(colId) {
            const board = getActiveBoard();
            const col = board.columns.find(c => c.id === colId);
            if (!col) return;

            const cardCount = col.cards.length;
            const message = cardCount > 0 
                ? `Column "${col.title}" has ${cardCount} task(s). Are you sure you want to delete it and all its tasks?` 
                : `Delete column "${col.title}"?`;

            if (confirm(message)) {
                board.columns = board.columns.filter(c => c.id !== colId);
                saveState();
                renderColumns();
                lucide.createIcons();
                showToast(`Column deleted`, 'error');
            }
        }

        function moveColumnOrder(colId, direction) {
            const board = getActiveBoard();
            const index = board.columns.findIndex(c => c.id === colId);
            if (index === -1) return;

            const newIndex = index + direction;
            if (newIndex >= 0 && newIndex < board.columns.length) {
                const [movedCol] = board.columns.splice(index, 1);
                board.columns.splice(newIndex, 0, movedCol);
                saveState();
                renderColumns();
                lucide.createIcons();
            }
        }

        function toggleBoardDropdown() {
            const dropdown = document.getElementById('boardDropdown');
            dropdown.classList.toggle('hidden');
        }

        function selectBoard(boardId) {
            state.activeBoardId = boardId;
            saveState();
            renderApp();
            document.getElementById('boardDropdown').classList.add('hidden');
        }

        let editingBoardId = null;

        function openNewBoardModal() {
            editingBoardId = null;
            document.getElementById('boardModalTitle').textContent = 'Create New Board';
            document.getElementById('boardModalInput').value = 'Untitled Board';
            renderAccentColorPalette(ACCENT_COLORS[0].hex);
            document.getElementById('boardDropdown').classList.add('hidden');
            document.getElementById('boardModal').classList.remove('hidden');
        }

        function openEditBoardModal() {
            const board = getActiveBoard();
            if (!board) return;
            editingBoardId = board.id;
            document.getElementById('boardModalTitle').textContent = 'Board Settings';
            document.getElementById('boardModalInput').value = board.title;
            renderAccentColorPalette(board.accentColor || ACCENT_COLORS[0].hex);
            document.getElementById('boardDropdown').classList.add('hidden');
            document.getElementById('boardModal').classList.remove('hidden');
        }

        let selectedAccentColor = ACCENT_COLORS[0].hex;

        function renderAccentColorPalette(activeHex) {
            selectedAccentColor = activeHex;
            const container = document.getElementById('accentColorPalette');
            container.innerHTML = '';

            ACCENT_COLORS.forEach(c => {
                const isSelected = c.hex.toLowerCase() === activeHex.toLowerCase();
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `w-7 h-7 rounded-full transition-transform ${isSelected ? 'scale-125 ring-2 ring-offset-2 ring-apple-blue dark:ring-offset-[#1C1C1E]' : 'hover:scale-110'}`;
                btn.style.backgroundColor = c.hex;
                btn.onclick = () => renderAccentColorPalette(c.hex);
                container.appendChild(btn);
            });
        }

        function closeBoardModal() {
            document.getElementById('boardModal').classList.add('hidden');
        }

        function saveBoardSettings() {
            const titleInput = document.getElementById('boardModalInput').value.trim() || 'Untitled Board';

            if (editingBoardId) {
                const board = state.boards.find(b => b.id === editingBoardId);
                if (board) {
                    board.title = titleInput;
                    board.accentColor = selectedAccentColor;
                }
            } else {
                // New Board creation
                const newBoard = {
                    id: 'board-' + Date.now().toString(36),
                    title: titleInput,
                    accentColor: selectedAccentColor,
                    columns: [
                        { id: 'col-1', title: 'To Do', cards: [] },
                        { id: 'col-2', title: 'In Progress', cards: [] },
                        { id: 'col-3', title: 'Done', cards: [] }
                    ]
                };
                state.boards.push(newBoard);
                state.activeBoardId = newBoard.id;
            }

            saveState();
            closeBoardModal();
            renderApp();
            showToast('Board updated');
        }

        function deleteCurrentBoard() {
            if (state.boards.length <= 1) {
                alert('You must have at least one board.');
                return;
            }

            const board = getActiveBoard();
            if (confirm(`Delete board "${board.title}" and all its tasks? This cannot be undone.`)) {
                state.boards = state.boards.filter(b => b.id !== board.id);
                state.activeBoardId = state.boards[0].id;
                saveState();
                renderApp();
                showToast('Board deleted', 'error');
            }
        }

        function handleSearch(val) {
            state.searchQuery = val;
            const clearBtn = document.getElementById('searchClearBtn');
            if (val.trim()) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            renderColumns();
            lucide.createIcons();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            handleSearch('');
        }

        function matchesSearch(card, query) {
            if (!query) return true;
            const inTitle = card.title.toLowerCase().includes(query);
            const inDesc = (card.desc || '').toLowerCase().includes(query);
            const inPriority = (card.priority || '').toLowerCase().includes(query);
            const inTags = (card.tags || []).some(t => t.toLowerCase().includes(query));
            return inTitle || inDesc || inPriority || inTags;
        }

        function openStatsModal() {
            const board = getActiveBoard();
            if (!board) return;

            let total = 0;
            let urgent = 0;
            board.columns.forEach(col => {
                total += col.cards.length;
                col.cards.forEach(c => {
                    if (c.priority === 'urgent' || c.priority === 'high') urgent++;
                });
            });

            // Count completed from columns having 'done' or 'shipped' in name
            const doneCols = board.columns.filter(c => /done|shipped|finished|completed/i.test(c.title));
            const completed = doneCols.reduce((acc, c) => acc + c.cards.length, 0);

            document.getElementById('statTotalCards').textContent = total;
            document.getElementById('statCompletedCards').textContent = completed;
            document.getElementById('statUrgentCards').textContent = urgent;

            // List columns breakdown
            const list = document.getElementById('columnStatsList');
            list.innerHTML = '';
            board.columns.forEach(col => {
                const count = col.cards.length;
                const pct = total > 0 ? Math.round((count / total) * 100) : 0;
                const row = document.createElement('div');
                row.className = 'space-y-1';
                row.innerHTML = `
                    <div class="flex justify-between text-xs font-medium">
                        <span>${escapeHtml(col.title)}</span>
                        <span class="text-apple-gray-500">${count} (${pct}%)</span>
                    </div>
                    <div class="w-full h-1.5 bg-[#E5E5EA] dark:bg-[#3A3A3C] rounded-full overflow-hidden">
                        <div class="h-full bg-apple-blue" style="width: ${pct}%"></div>
                    </div>
                `;
                list.appendChild(row);
            });

            document.getElementById('statsModal').classList.remove('hidden');
        }

        function formatRelativeDate(dateStr) {
            if (!dateStr) return null;
            const parts = dateStr.split('-');
            if (parts.length !== 3) return null;

            const target = new Date(parts[0], parts[1] - 1, parts[2]);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            const diffTime = target - today;
            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 0) {
                return { text: `${Math.abs(diffDays)}d Overdue`, isOverdue: true };
            } else if (diffDays === 0) {
                return { text: 'Today', isOverdue: false };
            } else if (diffDays === 1) {
                return { text: 'Tomorrow', isOverdue: false };
            } else if (diffDays <= 7) {
                return { text: `In ${diffDays}d`, isOverdue: false };
            } else {
                return { text: target.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }), isOverdue: false };
            }
        }

        function escapeHtml(string) {
            if (!string) return '';
            return String(string)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast-enter px-4 py-2.5 rounded-2xl bg-white/90 dark:bg-[#2C2C2E]/90 apple-frosted border border-black/[0.08] dark:border-white/[0.1] shadow-apple-card text-xs font-medium flex items-center gap-2 text-[#1D1D1F] dark:text-[#F5F5F7] pointer-events-auto';

            let iconHtml = '<i data-lucide="check-circle" class="w-3.5 h-3.5 text-apple-green"></i>';
            if (type === 'error') {
                iconHtml = '<i data-lucide="alert-circle" class="w-3.5 h-3.5 text-apple-red"></i>';
            } else if (type === 'info') {
                iconHtml = '<i data-lucide="info" class="w-3.5 h-3.5 text-apple-blue"></i>';
            }

            toast.innerHTML = `${iconHtml} <span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 250);
            }, 2600);
        }

        // Initialize application on window load
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
